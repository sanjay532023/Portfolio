<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}WaveBox{% endblock %}</title><link rel="stylesheet" href="{% static 'player/style.css' %}"></head>
<body><header><a class="brand" href="{% url 'home' %}">🎵 WaveBox</a><nav>
<a href="{% url 'home' %}">Playlists</a>

</nav></header><main>{% block content %}{% endblock %}</main>
<script src="{% static 'player/player.js' %}"></script></body></html>
